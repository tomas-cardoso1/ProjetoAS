openapi: 3.0.3
info:
  title: God's Eye — API de serviços (1.º incremento)
  version: 0.1.0
  description: Contrato proposto no E5 Desenho (secção 3). Os pedidos de utilizadores exigem autenticação (RNF-07).
paths:
  /api/machines:
    post:
      summary: Registar máquina e criar o gémeo digital (UC-01.S1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineInput' }
      responses:
        '201': { description: Máquina registada e gémeo digital criado }
        '400': { description: clienteId não existe no repositório de dados dos clientes }
        '502': { description: "Falha de ligação ao sensor; nada é guardado (CT-01.2)" }
    get:
      summary: Listar máquinas com estado (UC-02.S1)
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [online, alerta, offline] } }
      responses:
        '200': { description: Lista de máquinas com estado e hora da última atualização }
  /api/machines/{id}:
    get:
      summary: Estado de uma máquina (UC-02.S1)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Estado, temperatura, dados operacionais e hora da última leitura }
        '404': { description: Máquina não encontrada }
  /api/machines/{id}/stock:
    get:
      summary: Stock e validades por lote (UC-03.S1 e UC-03.S2)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: filtro, in: query, schema: { type: string, enum: [stock-baixo, perto-validade, expirado] } }
        - { name: q, in: query, description: Pesquisa pelo nome do produto, schema: { type: string } }
      responses:
        '200':
          description: Produtos com unidades, capacidade, mínimo, estado e lotes com validade e dias restantes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineStock' }
        '404': { description: Máquina não encontrada }
  /api/health:
    get:
      summary: Verificação da API e da base de dados (esqueleto)
      responses:
        '200': { description: API e base de dados disponíveis }
        '503': { description: Base de dados indisponível }
  /api/health:
    get:
      summary: Verificação da API e da base de dados (esqueleto)
      responses:
        '200': { description: API e base de dados disponíveis }
        '503': { description: Base de dados indisponível }
components:
  schemas:
    MachineInput:
      type: object
      required: [sensorId, localizacao, modelo, clienteId]
      properties:
        sensorId: { type: string }
        localizacao: { type: string }
        modelo: { type: string }
        clienteId: { type: string }
    MachineStock:
      type: object
      required: [maquinaId, ultimaAtualizacao, dadosAtuais, produtos]
      properties:
        maquinaId: { type: string, format: uuid }
        ultimaAtualizacao: { type: string, format: date-time, nullable: true }
        dadosAtuais: { type: boolean, description: Indica se a última leitura tem até 15 minutos. }
        produtos:
          type: array
          items: { $ref: '#/components/schemas/StockProduct' }
    StockProduct:
      type: object
      required: [produtoId, nome, unidades, capacidadeMaxima, stockMinimo, estado, lotes]
      properties:
        produtoId: { type: string }
        nome: { type: string }
        unidades: { type: integer, minimum: 0 }
        capacidadeMaxima: { type: integer, minimum: 0 }
        stockMinimo: { type: integer, minimum: 0 }
        estado:
          type: string
          enum: [Disponível, Stock baixo, Esgotado]
        lotes:
          type: array
          items: { $ref: '#/components/schemas/StockLot' }
    StockLot:
      type: object
      required: [produtoId, validade, diasRestantes, estado, avisoRemocaoObrigatoria]
      properties:
        produtoId: { type: string }
        validade: { type: string, format: date }
        diasRestantes: { type: integer }
        estado:
          type: string
          enum: [Dentro da validade, Perto da validade, Expirado]
        avisoRemocaoObrigatoria:
          type: string
          nullable: true
          description: Mensagem operacional apresentada quando o lote está expirado.
