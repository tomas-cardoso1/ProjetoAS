services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: godseye
      POSTGRES_PASSWORD: godseye
      POSTGRES_DB: godseye
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"

volumes:
  dbdata:
