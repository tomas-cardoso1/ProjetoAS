<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111"/></marker><marker id="arrowOpen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#111" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.head{font-size:18px;font-weight:600}.msg{font-size:15px}.small{font-size:13px}.lifeline{stroke:#777;stroke-dasharray:7 6;stroke-width:1}.call{stroke:#111;stroke-width:1.6;marker-end:url(#arrow)}.ret{stroke:#111;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#arrowOpen)}.sep{stroke:#c87925;stroke-width:1.3;stroke-dasharray:7 5}.frame{fill:none;stroke:#c87925;stroke-dasharray:5 4;stroke-width:1.3}</style><text x="850" y="25" text-anchor="middle" class="head">UC-01.S1 — Registar máquina e ativar gémeo digital</text><rect x="18" y="42" width="164" height="56" fill="#f3f5f7" stroke="#222" stroke-width="1.5"/><text x="100" y="67" text-anchor="middle" class="head" style="font-size:15px">Aplicação Web</text><line x1="100" y1="98" x2="100" y2="1050" class="lifeline"/><rect x="228" y="42" width="164" height="56" fill="#f3f5f7" stroke="#222" stroke-width="1.5"/><text x="310" y="67" text-anchor="middle" class="head" style="font-size:15px">API de serviços</text><line x1="310" y1="98" x2="310" y2="1050" class="lifeline"/><rect x="438" y="42" width="164" height="56" fill="#f3f5f7" stroke="#222" stroke-width="1.5"/><text x="520" y="59" text-anchor="middle" class="head" style="font-size:15px">Gestão de máquinas</text><text x="520" y="77" text-anchor="middle" class="head" style="font-size:15px">e estado</text><line x1="520" y1="98" x2="520" y2="1050" class="lifeline"/><rect x="648" y="42" width="164" height="56" fill="#f3f5f7" stroke="#222" stroke-width="1.5"/><text x="730" y="59" text-anchor="middle" class="head" style="font-size:15px">Repositório de dados</text><text x="730" y="77" text-anchor="middle" class="head" style="font-size:15px">dos clientes</text><line x1="730" y1="98" x2="730" y2="1050" class="lifeline"/><rect x="858" y="42" width="164" height="56" fill="#f3f5f7" stroke="#222" stroke-width="1.5"/><text x="940" y="59" text-anchor="middle" class="head" style="font-size:15px">Integração com</text><text x="940" y="77" text-anchor="middle" class="head" style="font-size:15px">sensores IoT</text><line x1="940" y1="98" x2="940" y2="1050" class="lifeline"/><rect x="1068" y="42" width="164" height="56" fill="#f3f5f7" stroke="#222" stroke-width="1.5"/><text x="1150" y="67" text-anchor="middle" class="head" style="font-size:15px">Broker MQTT</text><line x1="1150" y1="98" x2="1150" y2="1050" class="lifeline"/><rect x="1278" y="42" width="164" height="56" fill="#f3f5f7" stroke="#222" stroke-width="1.5"/><text x="1360" y="59" text-anchor="middle" class="head" style="font-size:15px">Repositório de dados</text><text x="1360" y="77" text-anchor="middle" class="head" style="font-size:15px">do sistema</text><line x1="1360" y1="98" x2="1360" y2="1050" class="lifeline"/><rect x="1488" y="42" width="164" height="56" fill="#f3f5f7" stroke="#222" stroke-width="1.5"/><text x="1570" y="67" text-anchor="middle" class="head" style="font-size:15px">Sensor da máquina</text><line x1="1570" y1="98" x2="1570" y2="1050" class="lifeline"/><rect x="1010" y="115" width="420" height="36" rx="3" fill="#fff8ed" stroke="#c87925"/><text x="1220" y="138" text-anchor="middle" class="small">Presença do sensor no broker: mecanismo a confirmar</text><line x1="1570" y1="180" x2="1150" y2="180" class="call"/><text x="1360" y="172" text-anchor="middle" class="msg">Estabelecer ligação MQTT</text><line x1="1150" y1="215" x2="1570" y2="215" class="ret"/><text x="1360" y="207" text-anchor="middle" class="msg">Ligação estabelecida</text><line x1="100" y1="285" x2="310" y2="285" class="call"/><text x="205" y="277" text-anchor="middle" class="msg">POST /api/machines {dados da máquina}</text><line x1="310" y1="335" x2="520" y2="335" class="call"/><text x="415" y="327" text-anchor="middle" class="msg">registarMáquina(dados)</text><line x1="520" y1="385" x2="730" y2="385" class="call"/><text x="625" y="377" text-anchor="middle" class="msg">validarCliente(clienteId)</text><line x1="730" y1="420" x2="520" y2="420" class="ret"/><text x="625" y="412" text-anchor="middle" class="msg">cliente válido</text><line x1="520" y1="465" x2="940" y2="465" class="call"/><text x="730" y="457" text-anchor="middle" class="msg">verificarLigação(sensorId)</text><line x1="940" y1="505" x2="1150" y2="505" class="call"/><text x="1045" y="497" text-anchor="middle" class="msg">consultarPresença(sensorId)</text><rect x="410" y="525" width="1040" height="455" class="frame"/><text x="850" y="546" class="small" fill="#8a4f17">alt [sensor ligado] / [sem ligação ou inválido]</text><line x1="1150" y1="580" x2="940" y2="580" class="ret"/><text x="1045" y="572" text-anchor="middle" class="msg">sensor ligado</text><line x1="940" y1="620" x2="520" y2="620" class="ret"/><text x="730" y="612" text-anchor="middle" class="msg">ligação confirmada</text><line x1="520" y1="665" x2="1360" y2="665" class="call"/><text x="940" y="657" text-anchor="middle" class="msg">guardar máquina + associação sensorId–máquina</text><line x1="1360" y1="705" x2="520" y2="705" class="ret"/><text x="940" y="697" text-anchor="middle" class="msg">máquina guardada; gémeo digital criado</text><line x1="520" y1="750" x2="310" y2="750" class="ret"/><text x="415" y="742" text-anchor="middle" class="msg">registo concluído</text><line x1="310" y1="790" x2="100" y2="790" class="ret"/><text x="205" y="782" text-anchor="middle" class="msg">201 Created {id, estado}</text><line x1="410" y1="820" x2="1450" y2="820" class="sep"/><text x="420" y="813" class="small" fill="#8a4f17">else [sensor sem ligação ou inválido]</text><line x1="1150" y1="855" x2="940" y2="855" class="ret"/><text x="1045" y="847" text-anchor="middle" class="msg">sensor sem ligação</text><line x1="940" y1="895" x2="520" y2="895" class="ret"/><text x="730" y="887" text-anchor="middle" class="msg">ligação não confirmada</text><line x1="520" y1="935" x2="310" y2="935" class="ret"/><text x="415" y="927" text-anchor="middle" class="msg">Falha de ligação ao sensor; não guardar</text><line x1="310" y1="975" x2="100" y2="975" class="ret"/><text x="205" y="967" text-anchor="middle" class="msg">502 Bad Gateway {mensagem}</text><text x="850" y="1035" text-anchor="middle" class="small">A associação sensor–máquina é guardada no repositório do sistema. O broker só transporta mensagens.</text></svg>