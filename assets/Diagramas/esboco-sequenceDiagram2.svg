<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1420" viewBox="0 0 1700 1420"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111"/></marker><marker id="arrowOpen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#111" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.head{font-size:17px;font-weight:600}.msg{font-size:14px}.small{font-size:13px}.lifeline{stroke:#777;stroke-dasharray:7 6;stroke-width:1}.call{stroke:#111;stroke-width:1.5;marker-end:url(#arrow)}.ret{stroke:#111;stroke-width:1.35;stroke-dasharray:7 5;marker-end:url(#arrowOpen)}.sep{stroke:#c87925;stroke-width:1.3;stroke-dasharray:7 5}.frame{fill:none;stroke:#c87925;stroke-dasharray:5 4;stroke-width:1.3}</style><text x="850" y="25" text-anchor="middle" class="head">UC-02.S1 / UC-03.S1 / UC-03.S2 — Leituras IoT e consulta</text><rect x="8" y="42" width="164" height="58" fill="#f3f5f7" stroke="#222" stroke-width="1.4"/><text x="90" y="60" text-anchor="middle" class="head" style="font-size:14px">Sensor /</text><text x="90" y="78" text-anchor="middle" class="head" style="font-size:14px">simulador</text><line x1="90" y1="100" x2="90" y2="1385" class="lifeline"/><rect x="218" y="42" width="164" height="58" fill="#f3f5f7" stroke="#222" stroke-width="1.4"/><text x="300" y="68" text-anchor="middle" class="head" style="font-size:14px">Broker MQTT</text><line x1="300" y1="100" x2="300" y2="1385" class="lifeline"/><rect x="428" y="42" width="164" height="58" fill="#f3f5f7" stroke="#222" stroke-width="1.4"/><text x="510" y="68" text-anchor="middle" class="head" style="font-size:14px">Integração IoT</text><line x1="510" y1="100" x2="510" y2="1385" class="lifeline"/><rect x="638" y="42" width="164" height="58" fill="#f3f5f7" stroke="#222" stroke-width="1.4"/><text x="720" y="60" text-anchor="middle" class="head" style="font-size:14px">Repositório</text><text x="720" y="78" text-anchor="middle" class="head" style="font-size:14px">do sistema</text><line x1="720" y1="100" x2="720" y2="1385" class="lifeline"/><rect x="848" y="42" width="164" height="58" fill="#f3f5f7" stroke="#222" stroke-width="1.4"/><text x="930" y="60" text-anchor="middle" class="head" style="font-size:14px">Gestão de máquinas</text><text x="930" y="78" text-anchor="middle" class="head" style="font-size:14px">e estado</text><line x1="930" y1="100" x2="930" y2="1385" class="lifeline"/><rect x="1058" y="42" width="164" height="58" fill="#f3f5f7" stroke="#222" stroke-width="1.4"/><text x="1140" y="60" text-anchor="middle" class="head" style="font-size:14px">Gestão de stock</text><text x="1140" y="78" text-anchor="middle" class="head" style="font-size:14px">e validades</text><line x1="1140" y1="100" x2="1140" y2="1385" class="lifeline"/><rect x="1268" y="42" width="164" height="58" fill="#f3f5f7" stroke="#222" stroke-width="1.4"/><text x="1350" y="68" text-anchor="middle" class="head" style="font-size:14px">API de serviços</text><line x1="1350" y1="100" x2="1350" y2="1385" class="lifeline"/><rect x="1478" y="42" width="164" height="58" fill="#f3f5f7" stroke="#222" stroke-width="1.4"/><text x="1560" y="68" text-anchor="middle" class="head" style="font-size:14px">Aplicação Web</text><line x1="1560" y1="100" x2="1560" y2="1385" class="lifeline"/><text x="850" y="137" text-anchor="middle" class="head" style="font-size:15px">Receção de leituras</text><line x1="25" y1="145" x2="1675" y2="145" class="sep"/><line x1="90" y1="190" x2="300" y2="190" class="call"/><text x="195" y="182" text-anchor="middle" class="msg">Publicar leitura {sensorId, timestamp, dados}</text><line x1="300" y1="230" x2="510" y2="230" class="call"/><text x="405" y="222" text-anchor="middle" class="msg">Entregar mensagem MQTT</text><path d="M510 252 h45 v28 h-45" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arrow)"/><text x="580" y="270" class="msg">Validar formato e valores</text><rect x="410" y="295" width="410" height="245" class="frame"/><text x="420" y="316" class="small" fill="#8a4f17">alt [leitura válida e sensor associado]</text><line x1="510" y1="355" x2="720" y2="355" class="call"/><text x="615" y="347" text-anchor="middle" class="msg">consultar máquina associada(sensorId)</text><line x1="720" y1="395" x2="510" y2="395" class="ret"/><text x="615" y="387" text-anchor="middle" class="msg">machineId</text><line x1="510" y1="435" x2="720" y2="435" class="call"/><text x="615" y="427" text-anchor="middle" class="msg">guardar leitura validada + timestamp</text><line x1="720" y1="475" x2="510" y2="475" class="ret"/><text x="615" y="467" text-anchor="middle" class="msg">leitura guardada</text><line x1="410" y1="490" x2="820" y2="490" class="sep"/><text x="420" y="485" class="small" fill="#8a4f17">else [inválida ou não associada]</text><path d="M510 510 h45 v24 h-45" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arrow)"/><text x="580" y="528" class="msg">Rejeitar; não persistir</text><text x="850" y="590" text-anchor="middle" class="head" style="font-size:15px">Consulta do estado e do stock por REST</text><line x1="25" y1="598" x2="1675" y2="598" class="sep"/><line x1="1560" y1="645" x2="1350" y2="645" class="call"/><text x="1455" y="637" text-anchor="middle" class="msg">GET /api/machines/{id}</text><line x1="1350" y1="690" x2="930" y2="690" class="call"/><text x="1140" y="682" text-anchor="middle" class="msg">obterEstado(id)</text><line x1="930" y1="735" x2="720" y2="735" class="call"/><text x="825" y="727" text-anchor="middle" class="msg">consultar última leitura(id)</text><line x1="720" y1="775" x2="930" y2="775" class="ret"/><text x="825" y="767" text-anchor="middle" class="msg">leitura + timestamp</text><rect x="665" y="795" width="740" height="145" class="frame"/><text x="675" y="815" class="small" fill="#8a4f17">alt estado derivado da última leitura</text><line x1="930" y1="850" x2="1350" y2="850" class="ret"/><text x="1140" y="842" text-anchor="middle" class="msg">Online se leitura recente</text><line x1="930" y1="900" x2="1350" y2="900" class="ret"/><text x="1140" y="892" text-anchor="middle" class="msg">Offline se &gt;15 min; devolver última leitura e hora</text><line x1="1350" y1="965" x2="1560" y2="965" class="ret"/><text x="1455" y="957" text-anchor="middle" class="msg">200 OK {estado, dados, últimaAtualização}</text><line x1="1560" y1="1030" x2="1350" y2="1030" class="call"/><text x="1455" y="1022" text-anchor="middle" class="msg">GET /api/machines/{id}/stock?filtro=&amp;q=</text><line x1="1350" y1="1075" x2="1140" y2="1075" class="call"/><text x="1245" y="1067" text-anchor="middle" class="msg">obterStock(id, filtros)</text><line x1="1140" y1="1120" x2="720" y2="1120" class="call"/><text x="930" y="1112" text-anchor="middle" class="msg">consultar produtos, stock e lotes</text><line x1="720" y1="1160" x2="1140" y2="1160" class="ret"/><text x="930" y="1152" text-anchor="middle" class="msg">stock, lotes, validades + timestamp</text><line x1="1140" y1="1200" x2="1350" y2="1200" class="ret"/><text x="1245" y="1192" text-anchor="middle" class="msg">resultados da consulta</text><line x1="1350" y1="1240" x2="1560" y2="1240" class="ret"/><text x="1455" y="1232" text-anchor="middle" class="msg">200 OK {stock, lotes, validades, últimaAtualização}</text><rect x="150" y="1280" width="1400" height="54" rx="3" fill="#fff8ed" stroke="#c87925"/><text x="850" y="1303" text-anchor="middle" class="small">Não incluir alertas ativos nesta versão se o módulo Alertas continuar futuro. Confirmar a origem dos dados de lotes e validades.</text><text x="850" y="1322" text-anchor="middle" class="small">O broker participa apenas na ingestão; as consultas da aplicação continuam pela API REST.</text></svg>